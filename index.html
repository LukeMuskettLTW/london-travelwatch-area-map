<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>London TravelWatch Area Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; width: 100%; }

    .panel {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      width: 360px;
      max-width: calc(100vw - 24px);
      background: rgba(255,255,255,0.97);
      border-radius: 16px;
      box-shadow: 0 8px 26px rgba(0,0,0,0.16);
      padding: 12px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* Tighter header spacing (fix chunky gap) */
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 6px 0;     /* tighter than before */
      padding: 0;            /* ensure no extra padding */
    }
    .panel h3 {
      margin: 0;
      font-size: 18px;
      line-height: 1.15;
    }

    .chevron-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.12);
      background: rgba(255,255,255,0.9);
      cursor: pointer;
      user-select: none;
      flex: 0 0 auto;
    }
    .chevron-btn:focus-visible {
      outline: 3px solid #ffd24d;
      outline-offset: 2px;
    }
    .chevron {
      width: 16px;
      height: 16px;
      display: inline-block;
      transition: transform 180ms ease;
      transform-origin: 50% 50%;
    }
    .chevron-btn[aria-expanded="true"] .chevron {
      transform: rotate(180deg);
    }

    .row { display: flex; gap: 10px; align-items: center; }
    .row + .row { margin-top: 8px; }
    label { display: flex; align-items: center; gap: 10px; font-size: 15px; }
    input[type="checkbox"] { transform: scale(1.1); }

    .section { margin-top: 10px; border-top: 1px solid rgba(0,0,0,0.08); padding-top: 10px; }
    .section.search { margin-top: 8px; } /* tighter */

    .search label {
      font-weight: 800;
      margin: 0 0 6px 0;   /* tighter */
      display: block;
      font-size: 16px;
    }
    .search .row { align-items: stretch; }

    .search-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search input[type="text"]{
      width: 100%;
      padding: 10px 42px 10px 12px;
      border: 1px solid rgba(0,0,0,0.22);
      border-radius: 12px;
      font-size: 15px;
      outline: none;
    }
    .search input[type="text"]:focus {
      border-color: rgba(0,0,0,0.35);
      box-shadow: 0 0 0 3px rgba(255,210,77,0.45);
    }

    .clear-btn {
      position: absolute;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.12);
      background: rgba(255,255,255,0.95);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      line-height: 1;
      color: rgba(0,0,0,0.72);
    }
    .clear-btn:focus-visible {
      outline: 3px solid #ffd24d;
      outline-offset: 2px;
    }

    .btn {
      padding: 10px 12px;
      border: 0;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
      background: #0b7a3b;
      color: #ffffff;
      white-space: nowrap;
      min-width: 52px;
    }
    .btn:hover { background: #095f2e; }
    .btn:focus-visible {
      outline: 3px solid #ffd24d;
      outline-offset: 2px;
    }

    .secondary-btn {
      width: 100%;
      margin-top: 10px;
      padding: 10px 12px;
      border: 1px solid rgba(0,0,0,0.16);
      border-radius: 12px;
      background: rgba(255,255,255,0.92);
      cursor: pointer;
      font-size: 15px;
      text-align: left;
    }
    .secondary-btn:hover { background: rgba(255,255,255,1); }
    .secondary-btn:focus-visible {
      outline: 3px solid #ffd24d;
      outline-offset: 2px;
    }

    /* Suggestions dropdown */
    .suggestions {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 6px);
      z-index: 2000;
      background: rgba(255,255,255,0.98);
      border: 1px solid rgba(0,0,0,0.16);
      border-radius: 12px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.14);
      max-height: 240px;
      overflow: auto;
      display: none;
    }
    .suggestions[aria-hidden="false"] { display: block; }

    .suggestion-item {
      padding: 10px 12px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    .suggestion-item + .suggestion-item { border-top: 1px solid rgba(0,0,0,0.06); }
    .suggestion-item:hover { background: rgba(11,122,59,0.08); }
    .suggestion-left { font-weight: 650; }
    .suggestion-right { font-size: 12px; color: rgba(0,0,0,0.55); white-space: nowrap; }

    /* Collapsible toggles wrapper */
    .toggles-wrap {
      overflow: hidden;
      transition: max-height 220ms ease, opacity 160ms ease;
      opacity: 1;
      max-height: 500px;
    }
    .toggles-wrap.collapsed {
      opacity: 0;
      max-height: 0;
      pointer-events: none;
      margin: 0;
      padding: 0;
    }

    /* Separate floating key */
    .map-key {
      background: rgba(255,255,255,0.95);
      padding: 10px 12px;
      border-radius: 14px;
      box-shadow: 0 8px 26px rgba(0,0,0,0.16);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.25;
    }
    .map-key .title {
      font-weight: 800;
      margin: 0 0 8px 0;
      font-size: 13px;
    }
    .map-key .legend {
      display: grid;
      grid-template-columns: 14px 1fr;
      gap: 8px 10px;
      align-items: center;
    }
    .map-key .swatch {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.25);
    }

    /* Mobile tightening */
    @media (max-width: 520px) {
      .panel{
        width: calc(100vw - 16px);
        right: 8px;
        top: 8px;
        padding: 10px;
        border-radius: 14px;
      }
      .panel h3 { font-size: 16px; }
      .chevron-btn { width: 34px; height: 34px; border-radius: 12px; }
      .section { margin-top: 8px; padding-top: 8px; }
      .search label { font-size: 15px; margin-bottom: 6px; }
      .search input[type="text"] { padding: 9px 40px 9px 10px; }
      .btn { padding: 9px 12px; }
      .secondary-btn { padding: 9px 10px; }
      .suggestions { max-height: 200px; }
      .map-key { padding: 8px 10px; font-size: 12px; }
      .map-key .legend { grid-template-columns: 12px 1fr; gap: 6px 8px; }
      .map-key .swatch { width: 10px; height: 10px; }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="panel" id="panel">
    <div class="panel-header">
      <h3>London TravelWatch Area Map</h3>

      <button id="btnChevron" class="chevron-btn" type="button"
              aria-expanded="true" aria-controls="togglesWrap" title="Show/hide layers">
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>
    </div>

    <div id="togglesWrap" class="toggles-wrap">
      <div class="row">
        <label><input id="chkLtwArea" type="checkbox" checked> London TravelWatch area</label>
      </div>
      <div class="row">
        <label><input id="chkLtwStations" type="checkbox" checked> London TravelWatch stations</label>
      </div>
      <div class="row">
        <label><input id="chkTfArea" type="checkbox"> Transport Focus area</label>
      </div>
      <div class="row">
        <label><input id="chkTfStations" type="checkbox"> Transport Focus stations</label>
      </div>
    </div>

    <div class="section search">
      <label for="txtSearch">Search station…</label>
      <div class="row">
        <div class="search-wrap">
          <input id="txtSearch" type="text" placeholder="e.g. Orpington" autocomplete="off" />
          <button id="btnClear" class="clear-btn" type="button" aria-label="Clear search">×</button>

          <!-- Suggestions dropdown -->
          <div id="suggestions" class="suggestions" aria-hidden="true"></div>
        </div>
        <button id="btnSearch" class="btn" type="button">Go</button>
      </div>

      <button id="btnZoomLtw" class="secondary-btn" type="button">
        Zoom to London TravelWatch area
      </button>
    </div>
  </div>

  <script>
    // Files
    const CSV_FILE = "correct_ltw_list.csv";
    const BOUNDARY_FILE = "ltw_remit_boundary.geojson";

    const REMIT_LTW = "London TravelWatch";
    const REMIT_TF  = "Transport Focus";

    const csvUrl = new URL(CSV_FILE, window.location.href).toString();
    const boundaryUrl = new URL(BOUNDARY_FILE, window.location.href).toString();

    const toBool = (v) => String(v).trim().toLowerCase() === "true" || v === true;

    // ===== Name normalisation =====
    const DROP_WORDS = new Set(["station","stn","railway","rail","train"]);

    function normalizeName(s) {
      let x = String(s || "").toLowerCase().trim();
      x = x.replace(/[’‘`´]/g, "'").replace(/'/g, "");
      x = x.replace(/[^a-z0-9\s]/g, " ");
      x = x.replace(/\s+/g, " ").trim();
      const parts = x.split(" ").filter(Boolean).filter(w => !DROP_WORDS.has(w));
      return parts.join(" ").trim();
    }

    // word-boundary prefix (bow != bowling)
    function wordPrefixMatch(nameNorm, qNorm) {
      if (!qNorm) return false;
      if (nameNorm === qNorm) return true;
      if (nameNorm.startsWith(qNorm + " ")) return true;
      return false;
    }

    // ===== Map =====
    const map = L.map("map", { preferCanvas: true }).setView([51.5074, -0.1278], 9);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Floating key
    const keyControl = L.control({ position: "bottomright" });
    keyControl.onAdd = function () {
      const div = L.DomUtil.create("div", "map-key");
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);

      div.innerHTML = `
        <div class="title">Key</div>
        <div class="legend">
          <div class="swatch" style="background:#0b7a3b; opacity:0.22;"></div>
          <div>London TravelWatch area</div>

          <div class="swatch" style="background:#0b7a3b;"></div>
          <div>London TravelWatch station</div>

          <div class="swatch" style="background:#b2182b; opacity:0.10;"></div>
          <div>Transport Focus area</div>

          <div class="swatch" style="background:#b2182b;"></div>
          <div>Transport Focus station</div>
        </div>
      `;
      return div;
    };
    keyControl.addTo(map);

    // Layers
    const ltwStationsLayer = L.layerGroup().addTo(map);
    const tfStationsLayer  = L.layerGroup();
    let ltwAreaLayer = null;
    let tfAreaLayer  = null;

    // Grouped stations
    const stationGroups = new Map();
    const allGroupMarkers = []; // {name, nameNorm, marker, lat, lon, remit}

    function circleStyle(remit) {
      return remit === REMIT_LTW
        ? { radius: 4, weight: 1, opacity: 1.0, fillOpacity: 0.85 }
        : { radius: 4, weight: 1, opacity: 0.9, fillOpacity: 0.65 };
    }
    function circleColors(remit) {
      return remit === REMIT_LTW
        ? { color: "#0b7a3b", fillColor: "#0b7a3b" }
        : { color: "#b2182b", fillColor: "#b2182b" };
    }

    function applyLayerToggles() {
      const showLtwArea     = document.getElementById("chkLtwArea").checked;
      const showLtwStations = document.getElementById("chkLtwStations").checked;
      const showTfArea      = document.getElementById("chkTfArea").checked;
      const showTfStations  = document.getElementById("chkTfStations").checked;

      if (ltwAreaLayer) { showLtwArea ? map.addLayer(ltwAreaLayer) : map.removeLayer(ltwAreaLayer); }
      if (tfAreaLayer)  { showTfArea  ? map.addLayer(tfAreaLayer)  : map.removeLayer(tfAreaLayer); }

      showLtwStations ? map.addLayer(ltwStationsLayer) : map.removeLayer(ltwStationsLayer);
      showTfStations  ? map.addLayer(tfStationsLayer)  : map.removeLayer(tfStationsLayer);
    }

    function meanLatLon(points) {
      let sumLat = 0, sumLon = 0;
      for (const p of points) { sumLat += p.lat; sumLon += p.lon; }
      return { lat: sumLat / points.length, lon: sumLon / points.length };
    }

    function updateGroupMarker(group) {
      const { lat, lon } = meanLatLon(group.points);
      group.lat = lat; group.lon = lon;

      const modes = Array.from(group.modes).sort((a,b)=>a.localeCompare(b));
      const modesText = modes.length ? modes.join(", ") : "—";

      let popupHtml = `
        <b style="font-size:16px">${group.name}</b><br>
        Remit: ${group.remit}<br>
        Modes: ${modesText}
      `;

      if (group.specialNote) popupHtml += `<br><b>${group.specialNote}</b>`;

      if (!group.marker) {
        group.marker = L.circleMarker([lat, lon], {
          ...circleStyle(group.remit),
          ...circleColors(group.remit)
        }).bindPopup(popupHtml, {
          autoPan: false,
          closeButton: true
        });

        if (group.remit === REMIT_LTW) group.marker.addTo(ltwStationsLayer);
        else group.marker.addTo(tfStationsLayer);

        allGroupMarkers.push({
          name: group.name,
          nameNorm: normalizeName(group.name),
          marker: group.marker,
          lat,
          lon,
          remit: group.remit
        });
      } else {
        group.marker.setLatLng([lat, lon]);
        group.marker.setPopupContent(popupHtml);
      }
    }

    async function loadStationsFromCSV() {
      return new Promise((resolve, reject) => {
        Papa.parse(csvUrl, {
          download: true,
          header: true,
          dynamicTyping: true,
          skipEmptyLines: true,
          complete: (results) => {
            try {
              if (results.errors && results.errors.length) console.warn("PapaParse errors:", results.errors);

              const rows = results.data || [];
              let bad = 0;

              for (const r of rows) {
                const lat = r.latitude;
                const lon = r.longitude;
                if (typeof lat !== "number" || typeof lon !== "number" || !isFinite(lat) || !isFinite(lon)) { bad++; continue; }

                const remit = toBool(r.in_ltw_area) ? REMIT_LTW : REMIT_TF;
                const name = (r.name || "(no name)").trim();
                const mode = String(r.mode || "").trim();
                const specialNote = (r.special_note || r.specialNote || "").toString().trim();

                const gKey = `${normalizeName(name)}||${remit}`;
                let group = stationGroups.get(gKey);
                if (!group) {
                  group = { key: gKey, name, remit, points: [], modes: new Set(), marker: null, lat: null, lon: null, specialNote: "" };
                  stationGroups.set(gKey, group);
                }

                group.points.push({ lat, lon });
                if (mode) group.modes.add(mode);
                if (specialNote) group.specialNote = specialNote;
              }

              for (const group of stationGroups.values()) updateGroupMarker(group);

              console.log(`Stations loaded (grouped): groups=${stationGroups.size}, bad=${bad}, rows=${rows.length}`);
              resolve();
            } catch (e) {
              reject(e);
            }
          },
          error: (err) => reject(err)
        });
      });
    }

    async function loadBoundaryGeoJSON() {
      const resp = await fetch(boundaryUrl, { cache: "no-store" });
      if (!resp.ok) throw new Error(`Boundary fetch failed: ${resp.status} ${resp.statusText}`);
      const geo = await resp.json();

      if (ltwAreaLayer) { map.removeLayer(ltwAreaLayer); ltwAreaLayer = null; }
      if (tfAreaLayer)  { map.removeLayer(tfAreaLayer);  tfAreaLayer = null; }

      const feats = (geo && geo.features) ? geo.features : [];
      const ltwFeats = [];
      const tfFeats = [];

      for (const f of feats) {
        const props = f.properties || {};
        const tag = String(props.area || props.remit || "").toLowerCase();
        if (tag === "ltw") ltwFeats.push(f);
        if (tag === "tf" || tag === "gb_rest" || tag === "transport_focus") tfFeats.push(f);
      }

      if (!ltwFeats.length && !tfFeats.length) throw new Error(`Boundary file loaded, but no features were tagged as "ltw"/"tf".`);

      if (ltwFeats.length) {
        ltwAreaLayer = L.geoJSON(
          { type: "FeatureCollection", features: ltwFeats },
          { interactive: false, style: { color: "#0b7a3b", weight: 3, opacity: 1, fillColor: "#0b7a3b", fillOpacity: 0.12 } }
        );
      }

      if (tfFeats.length) {
        tfAreaLayer = L.geoJSON(
          { type: "FeatureCollection", features: tfFeats },
          { interactive: false, style: { color: "transparent", weight: 0, opacity: 0, fillColor: "#b2182b", fillOpacity: 0.09 } }
        );
      }

      applyLayerToggles();
    }

    function bestSearchHit(qNorm) {
      // 1) exact match
      let hit = allGroupMarkers.find(m => m.nameNorm === qNorm);
      if (hit) return hit;

      // 2) word-boundary prefix match (prevents Bow -> Bowling)
      hit = allGroupMarkers.find(m => wordPrefixMatch(m.nameNorm, qNorm));
      if (hit) return hit;

      // 3) fallback contains (least strict)
      hit = allGroupMarkers.find(m => m.nameNorm.includes(qNorm));
      if (hit) return hit;

      return null;
    }

    function doSearchByNorm(qNorm, rawLabel) {
      const hit = bestSearchHit(qNorm);
      if (!hit) return alert(`No match found for: ${rawLabel}`);

      if (hit.remit === REMIT_LTW) document.getElementById("chkLtwStations").checked = true;
      else document.getElementById("chkTfStations").checked = true;

      applyLayerToggles();
      map.setView([hit.lat, hit.lon], 14, { animate: true });
      hit.marker.openPopup();
    }

    function doSearch() {
      const qRaw = document.getElementById("txtSearch").value;
      const qNorm = normalizeName(qRaw);
      if (!qNorm) return;
      hideSuggestions();
      doSearchByNorm(qNorm, qRaw);
    }

    function zoomToLtwArea() {
      if (ltwAreaLayer) {
        const b = ltwAreaLayer.getBounds();
        if (b && b.isValid()) { map.fitBounds(b, { padding: [20, 20] }); return; }
      }
      const ltwMarkers = allGroupMarkers.filter(m => m.remit === REMIT_LTW).map(m => [m.lat, m.lon]);
      if (!ltwMarkers.length) return;
      map.fitBounds(L.latLngBounds(ltwMarkers), { padding: [20, 20] });
    }

    // ===== Suggestions (type-ahead list) =====
    const txtSearch = document.getElementById("txtSearch");
    const suggestionsEl = document.getElementById("suggestions");

    function renderSuggestions(items) {
      if (!items.length) { hideSuggestions(); return; }

      suggestionsEl.innerHTML = items.map(it => {
        const remitShort = (it.remit === REMIT_LTW) ? "LTW" : "TF";
        return `
          <div class="suggestion-item" role="option" data-name-norm="${it.nameNorm.replace(/"/g, "&quot;")}" data-label="${it.name.replace(/"/g, "&quot;")}">
            <div class="suggestion-left">${it.name}</div>
            <div class="suggestion-right">${remitShort}</div>
          </div>
        `;
      }).join("");

      suggestionsEl.setAttribute("aria-hidden", "false");
    }

    function hideSuggestions() {
      suggestionsEl.setAttribute("aria-hidden", "true");
      suggestionsEl.innerHTML = "";
    }

    function getSuggestionMatches(qNorm, limit = 8) {
      if (!qNorm) return [];

      // Prefer exact/prefix matches first, then contains.
      const exact = [];
      const prefix = [];
      const contains = [];

      for (const m of allGroupMarkers) {
        if (m.nameNorm === qNorm) exact.push(m);
        else if (wordPrefixMatch(m.nameNorm, qNorm)) prefix.push(m);
        else if (m.nameNorm.includes(qNorm)) contains.push(m);
      }

      // Sort for stability
      const byName = (a,b) => a.name.localeCompare(b.name);
      exact.sort(byName); prefix.sort(byName); contains.sort(byName);

      const out = [...exact, ...prefix, ...contains];

      // De-dupe by normalized name (keep first)
      const seen = new Set();
      const deduped = [];
      for (const it of out) {
        if (seen.has(it.nameNorm)) continue;
        seen.add(it.nameNorm);
        deduped.push(it);
        if (deduped.length >= limit) break;
      }

      return deduped;
    }

    txtSearch.addEventListener("input", () => {
      updateClearBtn();
      const qNorm = normalizeName(txtSearch.value);
      if (!qNorm) { hideSuggestions(); return; }
      renderSuggestions(getSuggestionMatches(qNorm, 8));
    });

    // click on a suggestion
    suggestionsEl.addEventListener("click", (e) => {
      const item = e.target.closest(".suggestion-item");
      if (!item) return;
      const nameNorm = item.getAttribute("data-name-norm") || "";
      const label = item.getAttribute("data-label") || "";
      txtSearch.value = label;
      updateClearBtn();
      hideSuggestions();
      doSearchByNorm(nameNorm, label);
    });

    // hide suggestions when clicking outside
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-wrap")) hideSuggestions();
    });

    // ===== Collapsible toggles (chevron) =====
    const togglesWrap = document.getElementById("togglesWrap");
    const btnChevron = document.getElementById("btnChevron");

    function setTogglesCollapsed(collapsed) {
      if (collapsed) togglesWrap.classList.add("collapsed");
      else togglesWrap.classList.remove("collapsed");
      btnChevron.setAttribute("aria-expanded", collapsed ? "false" : "true");
    }
    function isMobile() { return window.matchMedia && window.matchMedia("(max-width: 520px)").matches; }

    btnChevron.addEventListener("click", () => {
      const currentlyCollapsed = togglesWrap.classList.contains("collapsed");
      setTogglesCollapsed(!currentlyCollapsed);
    });

    // ===== Clear button =====
    const btnClear = document.getElementById("btnClear");
    function updateClearBtn() { btnClear.style.display = txtSearch.value.trim() ? "inline-flex" : "none"; }
    txtSearch.addEventListener("input", updateClearBtn);
    btnClear.addEventListener("click", () => {
      txtSearch.value = "";
      updateClearBtn();
      hideSuggestions();
      txtSearch.focus();
    });

    // UI wiring
    document.getElementById("chkLtwArea").addEventListener("change", applyLayerToggles);
    document.getElementById("chkLtwStations").addEventListener("change", applyLayerToggles);
    document.getElementById("chkTfArea").addEventListener("change", applyLayerToggles);
    document.getElementById("chkTfStations").addEventListener("change", applyLayerToggles);

    document.getElementById("btnSearch").addEventListener("click", doSearch);
    txtSearch.addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });

    document.getElementById("btnZoomLtw").addEventListener("click", zoomToLtwArea);

    // Init
    (async function init() {
      try {
        setTogglesCollapsed(isMobile());

        await loadStationsFromCSV();
        await loadBoundaryGeoJSON();

        applyLayerToggles();
        updateClearBtn();
      } catch (e) {
        console.error(e);
        alert("Map data failed to load. Please refresh and try again.");
      }
    })();
  </script>
</body>
</html>
